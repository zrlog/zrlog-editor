name: Test editor package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: npm test
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: editor-package
          path: .tmp/packages/*.tgz
          include-hidden-files: true
